<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hand & Wrist Excercise</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #input-video {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(-1);
        }

        /* --- UI Container --- */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 300px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Class to hide the main UI */
        .ui-hidden {
            opacity: 0;
            transform: translateX(-20px);
            pointer-events: none !important;
        }

        /* --- Header & Controls --- */
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        #close-ui-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 5px;
            transition: color 0.3s;
        }
        #close-ui-btn:hover {
            color: white;
        }

        .controls {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- Re-open Button (Hidden by default) --- */
        #show-ui-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10; /* Same level as UI layer */
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #00e5ff;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            pointer-events: auto;
            display: none; /* Only shown when UI is hidden */
            transition: all 0.3s;
        }
        #show-ui-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        /* --- Standard Control Elements --- */
        #status {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.8rem;
            color: #00e5ff;
            font-weight: 600;
        }

        select, input[type="range"] {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px;
            border-radius: 4px;
            outline: none;
        }

        select option {
            background: #000;
        }

        button.action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            border-radius: 4px;
            margin-top: 5px;
        }

        button.action-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .instruction {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #ccc;
            line-height: 1.4;
        }

        /* --- Footer Section --- */
        #footer-links {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #aaa;
        }
        
        #footer-links a {
            color: #00e5ff;
            text-decoration: none;
            margin-right: 10px;
            display: inline-block;
            transition: color 0.2s;
        }
        
        #footer-links a:hover {
            color: #fff;
            text-shadow: 0 0 5px #00e5ff;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            font-size: 1.2rem;
            color: #00e5ff;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .gesture-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
            margin-right: 5px;
        }

        .value-display {
            font-size: 0.75rem;
            color: #fff;
            float: right;
        }
    </style>

    <!-- Import Map for Three.js and Addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">Initializing Neural Net & GPU...<br><small>Please allow camera access when prompted.</small></div>

    <!-- Floating button to show settings when hidden -->
    <button id="show-ui-btn">⚙️ Settings</button>

    <div id="ui-layer">
        <div class="controls">
            <!-- Header with Close Button -->
            <div class="panel-header">
                <h1>Hand Excercise</h1>
                <button id="close-ui-btn" title="Hide Settings">✕</button>
            </div>

            <div id="status">Waiting for camera...</div>

            <!-- Shape Selection -->
            <div class="control-group">
                <label for="shape-select">Select Shape</label>
                <select id="shape-select">
                    <option value="sphere">Density Sphere</option>
                    <option value="logo">H-Logo Shape</option>
                </select>
            </div>

            <!-- Particle Count -->
            <div class="control-group">
                <label>Particle Count <span id="count-val" class="value-display">8000</span></label>
                <input type="range" id="particle-count" min="1000" max="20000" step="1000" value="8000">
            </div>

            <!-- SDF/Force Threshold -->
            <div class="control-group">
                <label>SDF Threshold <span id="sdf-val" class="value-display">1.0</span></label>
                <input type="range" id="sdf-threshold" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>

            <div style="border-top: 1px solid #444; margin: 5px 0;"></div>

            <div style="margin-bottom: 5px;">
                <span id="gesture-dot" class="gesture-indicator"></span>
                <span id="gesture-text">No Hand Detected</span>
            </div>
            
            <button id="reset-btn" class="action-btn">Reset Simulation</button>
            <button id="toggle-cam-btn" class="action-btn">Stop Camera</button>

            <div class="instruction">
                🖐️ <b>Open Palm:</b> Idle Cloud<br>
                ✊ <b>Closed Fist:</b> Form Shape<br>
                🔄 <b>Rotate Hand:</b> 3D Rotation
            </div>

            <!-- Creator Links Footer -->
            <div id="footer-links">
                <div>Connect with Yash:</div>
                <div style="margin-top: 5px;">
                    <a href="https://www.linkedin.com/in/yashdeepsingh/" target="_blank">LinkedIn</a>
                    <a href="https://x.com/yd_singh" target="_blank">X (Twitter)</a>
                    <a href="https://github.com/yd-singh" target="_blank">GitHub</a>
                </div>
            </div>
        </div>
    </div>

    <video id="input-video" playsinline></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const CONFIG = {
            baseColor: new THREE.Color(0x00aaff),
            activeColor: new THREE.Color(0xff0055), // Will change based on mode
            cameraZ: 60,
            returnForce: 0.08,
            friction: 0.85,
            bloomStrength: 1.8,
            bloomRadius: 0.4,
            bloomThreshold: 0.1,
            
            // Dynamic User Settings
            particleCount: 8000,
            sdfMultiplier: 1.0, // Multiplier for attraction force
            currentShape: 'sphere' // 'sphere' or 'logo'
        };

        // --- Global State ---
        const state = {
            handDetected: false,
            handPosition: new THREE.Vector3(0, 0, 0),
            handRotation: new THREE.Quaternion(),
            fistRatio: 0.0 // 0.0 = Open, 1.0 = Fully Closed
        };

        // --- Shaders ---
        const vertexShader = `
            attribute float size;
            attribute vec3 customColor;
            varying vec3 vColor;
            void main() {
                vColor = customColor;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (300.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            uniform vec3 color;
            varying vec3 vColor;
            void main() {
                vec2 coord = gl_PointCoord - vec2(0.5);
                if(length(coord) > 0.5) discard;
                float strength = 1.0 - (length(coord) * 2.0);
                strength = pow(strength, 1.5);
                gl_FragColor = vec4(vColor * color, strength);
            }
        `;

        // --- Main Application ---
        class App {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.width = window.innerWidth;
                this.height = window.innerHeight;

                this.initThree();
                this.initParticles(CONFIG.particleCount);
                this.initPostProcessing();
                this.initMediaPipe();
                this.addListeners();

                this.clock = new THREE.Clock();
                this.animate();
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x000000, 0.002);

                this.camera = new THREE.PerspectiveCamera(75, this.width / this.height, 1, 1000);
                this.camera.position.z = CONFIG.cameraZ;

                this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
                this.renderer.setSize(this.width, this.height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.container.appendChild(this.renderer.domElement);
            }

            initParticles(count) {
                // Cleanup existing if present
                if (this.particleSystem) {
                    this.scene.remove(this.particleSystem);
                    this.geometry.dispose();
                }

                CONFIG.particleCount = parseInt(count);
                this.geometry = new THREE.BufferGeometry();
                
                const positions = new Float32Array(CONFIG.particleCount * 3);
                const colors = new Float32Array(CONFIG.particleCount * 3);
                const sizes = new Float32Array(CONFIG.particleCount);
                
                this.velocities = []; 
                this.homePositions = [];
                this.targetLogoPositions = []; // For the H-Logo

                const color = new THREE.Color();

                for (let i = 0; i < CONFIG.particleCount; i++) {
                    // 1. Home Positions (Random Cloud)
                    const x = (Math.random() * 2 - 1) * 60;
                    const y = (Math.random() * 2 - 1) * 40;
                    const z = (Math.random() * 2 - 1) * 20;

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    this.homePositions.push(new THREE.Vector3(x, y, z));
                    this.velocities.push(new THREE.Vector3(0, 0, 0));

                    // 2. Pre-calculate "H" Logo Positions
                    const shapeScale = 0.8; 
                    const barWidth = 8 * shapeScale;
                    const barHeight = 40 * shapeScale;
                    const bridgeWidth = 16 * shapeScale; 
                    const bridgeHeight = 8 * shapeScale;
                    const depth = 6 * shapeScale;

                    let tx, ty, tz;
                    const part = Math.random();

                    if (part < 0.4) { // Left Leg
                        tx = - (bridgeWidth/2 + barWidth/2) + (Math.random() - 0.5) * barWidth;
                        ty = (Math.random() - 0.5) * barHeight;
                        tz = (Math.random() - 0.5) * depth;
                    } else if (part < 0.8) { // Right Leg
                        tx = (bridgeWidth/2 + barWidth/2) + (Math.random() - 0.5) * barWidth;
                        ty = (Math.random() - 0.5) * barHeight;
                        tz = (Math.random() - 0.5) * depth;
                    } else { // Center Bridge
                        tx = (Math.random() - 0.5) * bridgeWidth;
                        ty = (Math.random() - 0.5) * bridgeHeight;
                        tz = (Math.random() - 0.5) * depth;
                    }
                    this.targetLogoPositions.push(new THREE.Vector3(tx, ty, tz));

                    // 3. Colors
                    color.setHSL(0.5 + Math.random() * 0.1, 0.8, 0.5);
                    colors[i * 3] = color.r;
                    colors[i * 3 + 1] = color.g;
                    colors[i * 3 + 2] = color.b;

                    sizes[i] = Math.random() * 2 + 1;
                }

                this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                this.geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
                this.geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        color: { value: new THREE.Color(0xffffff) }
                    },
                    vertexShader: vertexShader,
                    fragmentShader: fragmentShader,
                    blending: THREE.AdditiveBlending,
                    depthTest: false,
                    transparent: true
                });

                this.particleSystem = new THREE.Points(this.geometry, this.material);
                this.scene.add(this.particleSystem);
            }

            initPostProcessing() {
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));

                const bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(this.width, this.height),
                    CONFIG.bloomStrength,
                    CONFIG.bloomRadius,
                    CONFIG.bloomThreshold
                );
                this.composer.addPass(bloomPass);
            }

            initMediaPipe() {
                const videoElement = document.getElementById('input-video');
                const loadingElement = document.getElementById('loading');
                const statusElement = document.getElementById('status');
                const gestureText = document.getElementById('gesture-text');
                const gestureDot = document.getElementById('gesture-dot');

                this.hands = new Hands({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }});

                this.hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                this.hands.onResults((results) => {
                    loadingElement.style.display = 'none';
                    
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        state.handDetected = true;
                        statusElement.innerText = "Tracking Active";
                        statusElement.style.color = "#00ff00";

                        const landmarks = results.multiHandLandmarks[0];
                        this.updateHandState(landmarks);

                        // UI Feedback
                        if(state.fistRatio > 0.4) {
                            const strength = Math.round(((state.fistRatio - 0.4) / 0.6) * 100);
                            gestureText.innerText = `Forming Shape (${strength}%)`;
                            gestureText.style.color = CONFIG.currentShape === 'sphere' ? "#ff0055" : "#ffffff";
                            gestureDot.className = "gesture-indicator active-gesture";
                            gestureDot.style.background = gestureText.style.color;
                        } else {
                            gestureText.innerText = "Open Palm (Idle)";
                            gestureText.style.color = "#00aaff";
                            gestureDot.className = "gesture-indicator active-gesture";
                            gestureDot.style.background = "#00aaff";
                        }
                    } else {
                        state.handDetected = false;
                        statusElement.innerText = "Searching for hand...";
                        statusElement.style.color = "#aaa";
                        gestureText.innerText = "No Hand Detected";
                        gestureText.style.color = "#aaa";
                        gestureDot.className = "gesture-indicator";
                        gestureDot.style.background = "#333";
                        
                        state.handRotation.slerp(new THREE.Quaternion(), 0.05);
                        state.fistRatio = 0;
                    }
                });

                this.cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await this.hands.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });

                this.cameraUtils.start().catch(e => {
                    loadingElement.innerText = "Error: Camera Access Denied";
                    console.error(e);
                });
            }

            updateHandState(landmarks) {
                // Position
                const palm = landmarks[9];
                const aspect = this.width / this.height;
                const viewHeight = 2 * Math.tan((this.camera.fov * Math.PI) / 360) * CONFIG.cameraZ;
                const viewWidth = viewHeight * aspect;

                const targetX = (0.5 - palm.x) * viewWidth;
                const targetY = (0.5 - palm.y) * viewHeight;
                state.handPosition.lerp(new THREE.Vector3(targetX, targetY, 0), 0.2);

                // Fist Ratio
                const wrist = landmarks[0];
                const tips = [8, 12, 16, 20];
                let avgDist = 0;
                tips.forEach(idx => {
                    const tip = landmarks[idx];
                    const d = Math.sqrt(Math.pow(tip.x - wrist.x, 2) + Math.pow(tip.y - wrist.y, 2));
                    avgDist += d;
                });
                avgDist /= tips.length;

                const openThreshold = 0.45;
                const closedThreshold = 0.15;
                let ratio = (openThreshold - avgDist) / (openThreshold - closedThreshold);
                state.fistRatio = Math.max(0, Math.min(1, ratio));

                // Orientation
                const pWrist = new THREE.Vector3(landmarks[0].x, landmarks[0].y, landmarks[0].z);
                const pMiddle = new THREE.Vector3(landmarks[9].x, landmarks[9].y, landmarks[9].z);
                const pPinky = new THREE.Vector3(landmarks[17].x, landmarks[17].y, landmarks[17].z);

                const vY = new THREE.Vector3().subVectors(pMiddle, pWrist).normalize();
                const vPinky = new THREE.Vector3().subVectors(pPinky, pWrist).normalize();
                const vZ = new THREE.Vector3().crossVectors(vY, vPinky).normalize();
                const vX = new THREE.Vector3().crossVectors(vY, vZ).normalize();

                vY.y = -vY.y; vY.x = -vY.x; 
                vZ.x = -vZ.x; vX.x = -vX.x;

                const rotationMatrix = new THREE.Matrix4();
                rotationMatrix.makeBasis(vX, vY, vZ);
                
                const targetQuat = new THREE.Quaternion();
                targetQuat.setFromRotationMatrix(rotationMatrix);
                state.handRotation.slerp(targetQuat, 0.15);
            }

            updateParticles() {
                // Apply rotation
                if(state.handDetected) {
                    this.particleSystem.quaternion.slerp(state.handRotation, 0.1);
                } else {
                    this.particleSystem.quaternion.slerp(new THREE.Quaternion(), 0.02);
                }

                const positions = this.geometry.attributes.position.array;
                const colors = this.geometry.attributes.customColor.array;
                
                const p = new THREE.Vector3();
                const force = new THREE.Vector3();
                const colorIdle = CONFIG.baseColor;
                
                // Set active color based on shape
                const targetActiveColor = CONFIG.currentShape === 'sphere' ? new THREE.Color(0xff0055) : new THREE.Color(0xffffff);
                const tempColor = new THREE.Color();

                const localHandPos = state.handPosition.clone();
                this.particleSystem.worldToLocal(localHandPos);

                for (let i = 0; i < CONFIG.particleCount; i++) {
                    const idx = i * 3;
                    p.set(positions[idx], positions[idx + 1], positions[idx + 2]);
                    const velocity = this.velocities[i];

                    // === INTERACTION LOGIC ===
                    if (state.handDetected && state.fistRatio > 0.3) {
                        
                        if (CONFIG.currentShape === 'sphere') {
                            // --- SPHERE LOGIC ---
                            const targetRadius = 40 * (1.0 - state.fistRatio) + 2;
                            force.subVectors(localHandPos, p);
                            const dist = force.length();
                            const dir = force.normalize();
                            const displacement = dist - targetRadius;
                            
                            // SDF Threshold controls the force multiplier
                            let strength = displacement * 0.05 * (state.fistRatio + 0.5) * (2.0 * CONFIG.sdfMultiplier);
                            force.copy(dir).multiplyScalar(strength);
                            velocity.add(force);
                            velocity.multiplyScalar(0.85);

                        } else {
                            // --- LOGO LOGIC ---
                            const targetPos = localHandPos.clone().add(this.targetLogoPositions[i]);
                            force.subVectors(targetPos, p);
                            
                            // SDF Threshold controls the snap strength
                            const pullStrength = (state.fistRatio * 0.15 * CONFIG.sdfMultiplier) + 0.02;
                            
                            if (state.fistRatio < 0.9) {
                                // Add jitter if not fully closed
                                force.x += (Math.random() - 0.5) * (1.0 - state.fistRatio) * 5;
                                force.y += (Math.random() - 0.5) * (1.0 - state.fistRatio) * 5;
                                force.z += (Math.random() - 0.5) * (1.0 - state.fistRatio) * 5;
                            }

                            velocity.add(force.multiplyScalar(pullStrength));
                            velocity.multiplyScalar(CONFIG.friction);
                        }

                        tempColor.copy(colorIdle).lerp(targetActiveColor, state.fistRatio);

                    } else {
                        // --- IDLE LOGIC ---
                        const home = this.homePositions[i];
                        force.subVectors(home, p).multiplyScalar(CONFIG.returnForce);
                        velocity.add(force);
                        
                        velocity.x += (Math.random() - 0.5) * 0.02;
                        velocity.y += (Math.random() - 0.5) * 0.02;
                        velocity.z += (Math.random() - 0.5) * 0.02;

                        velocity.multiplyScalar(CONFIG.friction);
                        tempColor.copy(colorIdle);
                    }

                    p.add(velocity);
                    
                    positions[idx] = p.x;
                    positions[idx + 1] = p.y;
                    positions[idx + 2] = p.z;

                    colors[idx] = tempColor.r;
                    colors[idx + 1] = tempColor.g;
                    colors[idx + 2] = tempColor.b;
                }

                this.geometry.attributes.position.needsUpdate = true;
                this.geometry.attributes.customColor.needsUpdate = true;
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.updateParticles();
                
                if (!state.handDetected) {
                    this.particleSystem.rotation.y += 0.001;
                }

                this.composer.render();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.camera.aspect = this.width / this.height;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(this.width, this.height);
                this.composer.setSize(this.width, this.height);
            }

            addListeners() {
                window.addEventListener('resize', () => this.resize());
                
                // Toggle UI Logic
                const uiLayer = document.getElementById('ui-layer');
                const closeBtn = document.getElementById('close-ui-btn');
                const showBtn = document.getElementById('show-ui-btn');

                closeBtn.addEventListener('click', () => {
                    uiLayer.classList.add('ui-hidden');
                    showBtn.style.display = 'block';
                });

                showBtn.addEventListener('click', () => {
                    uiLayer.classList.remove('ui-hidden');
                    showBtn.style.display = 'none';
                });

                // Shape Selection
                document.getElementById('shape-select').addEventListener('change', (e) => {
                    CONFIG.currentShape = e.target.value;
                });

                // Particle Count Slider
                const countSlider = document.getElementById('particle-count');
                const countVal = document.getElementById('count-val');
                countSlider.addEventListener('change', (e) => {
                    const val = e.target.value;
                    countVal.innerText = val;
                    this.initParticles(val); // Re-init
                });
                countSlider.addEventListener('input', (e) => {
                    countVal.innerText = e.target.value;
                });

                // SDF Threshold Slider
                const sdfSlider = document.getElementById('sdf-threshold');
                const sdfVal = document.getElementById('sdf-val');
                sdfSlider.addEventListener('input', (e) => {
                    CONFIG.sdfMultiplier = parseFloat(e.target.value);
                    sdfVal.innerText = CONFIG.sdfMultiplier.toFixed(1);
                });

                // Reset Button
                document.getElementById('reset-btn').addEventListener('click', () => {
                    this.initParticles(CONFIG.particleCount);
                });

                // Camera Toggle
                document.getElementById('toggle-cam-btn').addEventListener('click', (e) => {
                    if (this.cameraUtils) {
                        const vid = document.getElementById('input-video');
                        if (vid.paused) {
                            vid.play();
                            e.target.innerText = "Stop Camera";
                        } else {
                            vid.pause();
                            e.target.innerText = "Start Camera";
                            state.handDetected = false;
                            document.getElementById('status').innerText = "Camera Paused";
                        }
                    }
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new App();
        });

    </script>
</body>
</html>
